<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CLT Pizza Madness — Final Four | CLTBeat</title>
<style>
  :root{
    --red:#E53935;
    --dark:#111111;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  header{
    text-align:center;
    padding:18px 12px 6px;
  }
  .brand{
    color:var(--red);
    font-weight:900;
    letter-spacing:2px;
    font-size:14px;
  }
  h1{
    font-size:clamp(28px,8vw,44px);
    font-weight:900;
    text-transform:uppercase;
    line-height:.95;
    letter-spacing:-1px;
  }
  h1 span{color:var(--red);}
  .round-label{
    display:inline-block;
    background:var(--dark);
    color:var(--white);
    font-weight:900;
    text-transform:uppercase;
    font-size:13px;
    letter-spacing:2px;
    padding:5px 14px;
    margin-top:8px;
  }
  .hint{
    font-size:12px;
    color:#888;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  #stage{
    position:relative;
    width:min(92vw,420px);
    flex:1;
    max-height:520px;
    margin:10px 0;
  }
  .card{
    position:absolute;
    inset:0;
    background:var(--red);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    cursor:grab;
    will-change:transform;
  }
  .card:active{cursor:grabbing;}
  .vs-tag{
    text-align:center;
    padding:14px 0 0;
    color:rgba(255,255,255,.85);
    font-weight:900;
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
  }
  .matchup{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:0;
    padding:10px 18px 18px;
  }
  .team{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-radius:12px;
    transition:background .15s, transform .15s;
    padding:8px;
  }
  .team .seed{
    font-size:12px;
    font-weight:900;
    color:rgba(255,255,255,.75);
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .team .name{
    font-size:clamp(26px,7vw,38px);
    font-weight:900;
    color:var(--white);
    text-transform:uppercase;
    line-height:1;
    margin-top:4px;
  }
  .team .arrow{
    font-size:20px;
    color:rgba(255,255,255,.7);
    margin-top:6px;
    font-weight:900;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:6px 0;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:2px;
    background:rgba(255,255,255,.35);
  }
  .divider span{
    background:var(--white);
    color:var(--red);
    font-weight:900;
    border-radius:50%;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .team.hot{
    background:rgba(255,255,255,.18);
    transform:scale(1.04);
  }
  .team.cold{opacity:.45;}
  .swipe-help{
    background:var(--dark);
    color:var(--white);
    display:flex;
    justify-content:space-between;
    padding:12px 20px;
    font-weight:900;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .swipe-help .l{color:#ffb3b0;}
  .swipe-help .r{color:#ffb3b0;}
  /* stamp */
  .stamp{
    position:absolute;
    top:24px;
    font-size:30px;
    font-weight:900;
    text-transform:uppercase;
    color:var(--white);
    border:4px solid var(--white);
    padding:4px 12px;
    border-radius:8px;
    opacity:0;
    transform:rotate(-12deg);
    pointer-events:none;
    background:rgba(0,0,0,.25);
  }
  .stamp.left{left:18px;}
  .stamp.right{right:18px;transform:rotate(12deg);}
  /* champion screen */
  #champ{
    position:absolute;
    inset:0;
    background:var(--dark);
    border-radius:18px;
    color:var(--white);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  #champ .trophy{font-size:64px;}
  #champ .label{
    color:var(--red);
    font-weight:900;
    letter-spacing:3px;
    font-size:13px;
    text-transform:uppercase;
    margin-top:10px;
  }
  #champ .winner{
    font-size:clamp(34px,9vw,52px);
    font-weight:900;
    text-transform:uppercase;
    line-height:1;
    margin-top:6px;
  }
  #champ .recap{
    margin-top:18px;
    font-size:13px;
    color:#bbb;
    line-height:1.7;
  }
  #champ button{
    margin-top:22px;
    background:var(--red);
    color:var(--white);
    border:none;
    font-weight:900;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:14px 26px;
    border-radius:10px;
    cursor:pointer;
  }
  footer{
    width:min(92vw,420px);
    text-align:center;
    padding:10px 0 18px;
  }
  footer .cta{
    font-size:12px;
    font-weight:700;
    color:var(--dark);
  }
  footer .cta a{color:var(--red);text-decoration:none;font-weight:900;}
  .demo-pill{
    position:fixed;
    top:10px;right:10px;
    background:var(--dark);
    color:var(--white);
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    opacity:.85;
  }
</style>
</head>
<body>
  <div class="demo-pill">Demo</div>
  <header>
    <div class="brand">CLT BEAT PRESENTS</div>
    <h1>Pizza <span>Madness</span></h1>
    <div class="round-label" id="roundLabel">Final Four</div>
    <div class="hint">Swipe toward your pick</div>
  </header>

  <div id="stage">
    <div id="champ">
      <div class="trophy">&#127942;</div>
      <div class="label">Charlotte's People's Champion</div>
      <div class="winner" id="champName"></div>
      <div class="recap" id="champRecap"></div>
      <button onclick="restart()">Run It Back</button>
    </div>
  </div>

  <footer>
    <div class="cta">Thinking about buying, selling, or investing in Charlotte?<br>
    &#128242; Text Michael: <a href="sms:7049001688">704-900-1688</a> &nbsp;|&nbsp; Follow <a href="https://www.instagram.com/cltbeat/">@CLTBeat</a></div>
  </footer>

<script>
// ---- FINAL FOUR (placeholder seeds — swap freely) ----
const finalFour = [
  { round:"Final Four — Semifinal 1",
    a:{seed:"1 Seed", name:"Inizio Pizza"},
    b:{seed:"People's Champ", name:"Bisonte Pizza Co."} },
  { round:"Final Four — Semifinal 2",
    a:{seed:"2 Seed", name:"Bird Pizzeria"},
    b:{seed:"Crowd Favorite", name:"Due Amici"} },
];

let queue = [];
let results = [];
let currentCard = null;

function buildDeck(){
  queue = finalFour.map(m => ({...m}));
  results = [];
  showNext();
}

function showNext(){
  const stage = document.getElementById('stage');
  const roundLabel = document.getElementById('roundLabel');

  if(queue.length === 0){
    if(results.length === 2){
      // championship
      queue.push({
        round:"National Championship",
        a:{seed:"Finalist", name:results[0]},
        b:{seed:"Finalist", name:results[1]}
      });
    } else if(results.length === 3){
      return showChampion();
    }
  }

  const m = queue.shift();
  roundLabel.textContent = m.round;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="vs-tag">Who advances?</div>
    <div class="matchup">
      <div class="team" id="teamA">
        <div class="seed">${m.a.seed}</div>
        <div class="name">${m.a.name}</div>
        <div class="arrow">&#8592; swipe left</div>
      </div>
      <div class="divider"><span>VS</span></div>
      <div class="team" id="teamB">
        <div class="seed">${m.b.seed}</div>
        <div class="name">${m.b.name}</div>
        <div class="arrow">swipe right &#8594;</div>
      </div>
    </div>
    <div class="swipe-help"><span class="l">&#8592; ${m.a.name}</span><span class="r">${m.b.name} &#8594;</span></div>
    <div class="stamp left">Voted!</div>
    <div class="stamp right">Voted!</div>
  `;
  document.getElementById('stage').appendChild(card);
  currentCard = card;
  attachSwipe(card, m);
}

function attachSwipe(card, matchup){
  let startX = 0, dx = 0, dragging = false;
  const teamA = card.querySelector('#teamA');
  const teamB = card.querySelector('#teamB');
  const stampL = card.querySelector('.stamp.left');
  const stampR = card.querySelector('.stamp.right');

  const onDown = e => {
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    card.style.transition = 'none';
  };
  const onMove = e => {
    if(!dragging) return;
    dx = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    const t = Math.min(Math.abs(dx)/110, 1);
    if(dx < -12){
      teamA.classList.add('hot'); teamB.classList.add('cold');
      teamB.classList.remove('hot'); teamA.classList.remove('cold');
      stampL.style.opacity = t; stampR.style.opacity = 0;
    } else if(dx > 12){
      teamB.classList.add('hot'); teamA.classList.add('cold');
      teamA.classList.remove('hot'); teamB.classList.remove('cold');
      stampR.style.opacity = t; stampL.style.opacity = 0;
    } else {
      teamA.classList.remove('hot','cold'); teamB.classList.remove('hot','cold');
      stampL.style.opacity = 0; stampR.style.opacity = 0;
    }
  };
  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    if(dx < -110){ fling(card, -1, matchup.a.name); }
    else if(dx > 110){ fling(card, 1, matchup.b.name); }
    else {
      card.style.transition = 'transform .25s';
      card.style.transform = '';
      teamA.classList.remove('hot','cold'); teamB.classList.remove('hot','cold');
      stampL.style.opacity = 0; stampR.style.opacity = 0;
    }
    dx = 0;
  };

  card.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  card.addEventListener('touchstart', onDown, {passive:true});
  card.addEventListener('touchmove', onMove, {passive:true});
  card.addEventListener('touchend', onUp);
}

function fling(card, dir, winner){
  card.style.transition = 'transform .4s ease-in, opacity .4s';
  card.style.transform = `translateX(${dir*600}px) rotate(${dir*30}deg)`;
  card.style.opacity = '0';
  results.push(winner);
  setTimeout(()=>{ card.remove(); showNext(); }, 380);
}

function showChampion(){
  const champ = results[2];
  document.getElementById('roundLabel').textContent = 'Champion';
  document.getElementById('champName').textContent = champ;
  document.getElementById('champRecap').innerHTML =
    `Semifinal 1: <b style="color:#fff">${results[0]}</b> advanced<br>` +
    `Semifinal 2: <b style="color:#fff">${results[1]}</b> advanced<br><br>` +
    `In the live version, everyone's swipes are counted together<br>and the city decides who cuts down the nets.`;
  document.getElementById('champ').style.display = 'flex';
}

function restart(){
  document.getElementById('champ').style.display = 'none';
  document.getElementById('roundLabel').textContent = 'Final Four';
  buildDeck();
}

buildDeck();
</script>
</body>
</html>
