<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CLT Pizza Madness — 64-Team Bracket | CLTBeat</title>
<style>
  :root{
    --red:#E53935;
    --dark:#111111;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  header{
    text-align:center;
    padding:14px 12px 4px;
  }
  .brand{
    color:var(--red);
    font-weight:900;
    letter-spacing:2px;
    font-size:13px;
  }
  h1{
    font-size:clamp(26px,7vw,40px);
    font-weight:900;
    text-transform:uppercase;
    line-height:.95;
    letter-spacing:-1px;
  }
  h1 span{color:var(--red);}
  .round-label{
    display:inline-block;
    background:var(--dark);
    color:var(--white);
    font-weight:900;
    text-transform:uppercase;
    font-size:12px;
    letter-spacing:2px;
    padding:5px 14px;
    margin-top:6px;
  }
  .progress-wrap{
    width:min(92vw,420px);
    margin-top:8px;
  }
  .progress-text{
    font-size:11px;
    color:#888;
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:center;
    margin-bottom:4px;
  }
  .progress-bar{
    height:5px;
    background:#eee;
    border-radius:3px;
    overflow:hidden;
  }
  .progress-bar div{
    height:100%;
    background:var(--red);
    width:0%;
    transition:width .3s;
  }
  #stage{
    position:relative;
    width:min(92vw,420px);
    flex:1;
    max-height:500px;
    margin:8px 0;
  }
  .card{
    position:absolute;
    inset:0;
    background:var(--red);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    cursor:grab;
    will-change:transform;
  }
  .card:active{cursor:grabbing;}
  .vs-tag{
    text-align:center;
    padding:12px 0 0;
    color:rgba(255,255,255,.85);
    font-weight:900;
    letter-spacing:3px;
    font-size:11px;
    text-transform:uppercase;
  }
  .matchup{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8px 18px 14px;
  }
  .team{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-radius:12px;
    transition:background .15s, transform .15s;
    padding:6px;
  }
  .team .seed{
    font-size:11px;
    font-weight:900;
    color:rgba(255,255,255,.75);
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .team .name{
    font-size:clamp(22px,6vw,32px);
    font-weight:900;
    color:var(--white);
    text-transform:uppercase;
    line-height:1;
    margin-top:3px;
  }
  .team .ig{
    display:inline-block;
    margin-top:6px;
    color:var(--white);
    background:rgba(0,0,0,.28);
    text-decoration:none;
    font-weight:900;
    font-size:12px;
    letter-spacing:.5px;
    padding:4px 12px;
    border-radius:20px;
  }
  .team .arrow{
    font-size:16px;
    color:rgba(255,255,255,.7);
    margin-top:5px;
    font-weight:900;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:4px 0;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:2px;
    background:rgba(255,255,255,.35);
  }
  .divider span{
    background:var(--white);
    color:var(--red);
    font-weight:900;
    border-radius:50%;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .team.hot{
    background:rgba(255,255,255,.18);
    transform:scale(1.04);
  }
  .team.cold{opacity:.45;}
  .swipe-help{
    background:var(--dark);
    color:var(--white);
    display:flex;
    justify-content:space-between;
    padding:10px 18px;
    font-weight:900;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    gap:8px;
  }
  .swipe-help span{color:#ffb3b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stamp{
    position:absolute;
    top:20px;
    font-size:26px;
    font-weight:900;
    text-transform:uppercase;
    color:var(--white);
    border:4px solid var(--white);
    padding:3px 10px;
    border-radius:8px;
    opacity:0;
    transform:rotate(-12deg);
    pointer-events:none;
    background:rgba(0,0,0,.25);
  }
  .stamp.left{left:16px;}
  .stamp.right{right:16px;transform:rotate(12deg);}
  #champ{
    position:absolute;
    inset:0;
    background:var(--dark);
    border-radius:18px;
    color:var(--white);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  #champ .trophy{font-size:56px;}
  #champ .label{
    color:var(--red);
    font-weight:900;
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
    margin-top:8px;
  }
  #champ .winner{
    font-size:clamp(30px,8vw,46px);
    font-weight:900;
    text-transform:uppercase;
    line-height:1;
    margin-top:5px;
  }
  #champ .recap{
    margin-top:14px;
    font-size:12px;
    color:#bbb;
    line-height:1.7;
  }
  #champ button{
    margin-top:18px;
    background:var(--red);
    color:var(--white);
    border:none;
    font-weight:900;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:12px 24px;
    border-radius:10px;
    cursor:pointer;
  }
  footer{
    width:min(92vw,420px);
    text-align:center;
    padding:8px 0 14px;
  }
  footer .cta{
    font-size:11px;
    font-weight:700;
    color:var(--dark);
  }
  footer .cta a{color:var(--red);text-decoration:none;font-weight:900;}
  .demo-pill{
    position:fixed;
    top:10px;right:10px;
    background:var(--dark);
    color:var(--white);
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    opacity:.85;
    z-index:10;
  }
</style>
</head>
<body>
  <div class="demo-pill">Demo</div>
  <header>
    <div class="brand">CLT BEAT PRESENTS</div>
    <h1>Pizza <span>Madness</span></h1>
    <div class="round-label" id="roundLabel">Round of 64</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-text" id="progressText"></div>
    <div class="progress-bar"><div id="progressFill"></div></div>
  </div>

  <div id="stage">
    <div id="champ">
      <div class="trophy">&#127942;</div>
      <div class="label">Charlotte's People's Champion</div>
      <div class="winner" id="champName"></div>
      <div class="recap" id="champRecap"></div>
      <button onclick="restart()">Run It Back</button>
    </div>
  </div>

  <footer>
    <div class="cta">Thinking about buying, selling, or investing in Charlotte?<br>
    &#128242; Text Michael: <a href="sms:7049001688">704-900-1688</a> &nbsp;|&nbsp; Follow <a href="https://www.instagram.com/cltbeat/">@CLTBeat</a></div>
  </footer>

<script>
// =====================================================================
// THE FIELD OF 64 — demo seeding from the original list + comment demand.
// Region names are for flavor, not geography. Swap any name/seed freely.
// "Wildcard" slots = to be filled by IG nominations.
// t(seed, name, igHandleOrNull)
// =====================================================================
const t = (s,n,ig)=>({s,n,ig});
const regions = [
  { name:"Uptown Region", teams:[
      t(1,"Inizio Pizza","iniziopizza"),
      t(2,"Zepeddie's","zepeddies"),
      t(3,"Mama Ricotta's","mamaricottas"),
      t(4,"Hawthorne's",null),
      t(5,"Fuel Pizza","fuelpizza"),
      t(6,"Empire Pizza",null),
      t(7,"Salud Cerveceria","saludcerveceria"),
      t(8,"The Crust","thecrustpizzaclt"),
      t(9,"Johnny Tomatoes",null),
      t(10,"NY Old School Bagel","new_york_old_school_bagel"),
      t(11,"Slice House",null),
      t(12,"House of Pizza",null),
      t(13,"Taste of Buffalo",null),
      t(14,"Hungry Howie's",null),
      t(15,"CiCi's",null),
      t(16,"Pizza Hut (N Tryon)",null),
  ]},
  { name:"South End Region", teams:[
      t(1,"Bird Pizzeria","birdpizzeria"),
      t(2,"Geno D's","genodspizza"),
      t(3,"Stagioni","stagioni_clt"),
      t(4,"Lorenzo's",null),
      t(5,"Portofino's","portofinosus"),
      t(6,"Intermezzo","intermezzo_pizzeria"),
      t(7,"Benny Pennello's","bennypennellos"),
      t(8,"Pizzeria Omaggio","omaggiopizzeria"),
      t(9,"Luigi's",null),
      t(10,"Luisa's",null),
      t(11,"Romeo & Juliet's",null),
      t(12,"Wolfman Pizza",null),
      t(13,"Emilio's (Fort Mill)",null),
      t(14,"Donatos (Fort Mill)","donatosfortmill"),
      t(15,"Jet's",null),
      t(16,"Wildcard 1",null),
  ]},
  { name:"NoDa Region", teams:[
      t(1,"Bisonte Pizza Co.","bisontepizzaco"),
      t(2,"Pizza Baby","eatpizzababy"),
      t(3,"Zambies","theshop.zambies"),
      t(4,"Giacomo's",null),
      t(5,"Sal's Pizza Factory","salspizzafactory"),
      t(6,"Pie_zaa","pie_zaa"),
      t(7,"Pure Pizza (Plaza)","pureontheplaza"),
      t(8,"King of Fire","kingoffirepizza"),
      t(9,"Wheelz Pizza","wheelzpizza_clt"),
      t(10,"Livy's Neapolitan","livysneapolitan"),
      t(11,"Neighbors 828","neighbors828artisankitchen"),
      t(12,"Izzy's",null),
      t(13,"Benny Ferrovia's","bennyferrovias"),
      t(14,"Brooklyn South",null),
      t(15,"Wildcard 2",null),
      t(16,"Wildcard 3",null),
  ]},
  { name:"Plaza Midwood Region", teams:[
      t(1,"Due Amici","due_amici_pizzeria"),
      t(2,"Pizzeria Sapienza","pizzeriasapienzaclt"),
      t(3,"Finale Pizza","finalepizza"),
      t(4,"Tony's Pizza","tonys_bigpizza"),
      t(5,"Gravity Sourdough","gravitypizzaclt"),
      t(6,"Brooklyn Pizza Parlor","brooklyn_pizza_parlor_colony"),
      t(7,"DaVinci's",null),
      t(8,"Carmella's",null),
      t(9,"Siano's","sianospizzapasta"),
      t(10,"Levante's",null),
      t(11,"Jett's",null),
      t(12,"Emmy Squared",null),
      t(13,"Wildcard 4",null),
      t(14,"Wildcard 5",null),
      t(15,"Wildcard 6",null),
      t(16,"Wildcard 7",null),
  ]},
];

// NCAA first-round pairings by seed
const seedPairs = [[1,16],[8,9],[5,12],[4,13],[6,11],[3,14],[7,10],[2,15]];

const roundNames = {32:"Round of 64", 16:"Round of 32", 8:"Sweet 16", 4:"Elite 8", 2:"Final Four", 1:"Championship"};
const totalMatchups = 63;

let matchups = [];      // current round's matchups
let winners = [];       // winners of current round (in order)
let regionChamps = [];
let finalists = [];
let done = 0;           // total matchups completed

function firstRound(){
  const list = [];
  for(const r of regions){
    const bySeed = {};
    r.teams.forEach(tm => bySeed[tm.s] = tm);
    for(const [a,b] of seedPairs){
      list.push({region:r.name, a:bySeed[a], b:bySeed[b]});
    }
  }
  return list;
}

function nextRound(prevMatchups, prevWinners){
  const list = [];
  for(let i=0; i<prevWinners.length; i+=2){
    list.push({
      region: prevWinners.length > 4 ? prevMatchups[i].region : "National",
      a: prevWinners[i],
      b: prevWinners[i+1]
    });
  }
  return list;
}

let queue = [];

function start(){
  matchups = firstRound();
  queue = [...matchups];
  winners = [];
  regionChamps = [];
  finalists = [];
  done = 0;
  document.getElementById('champ').style.display='none';
  showNext();
}

function showNext(){
  if(queue.length === 0){
    // round finished — build next round from winners
    if(winners.length === 1){
      return showChampion(winners[0]);
    }
    if(winners.length === 4) regionChamps = [...winners];
    if(winners.length === 2) finalists = [...winners];
    matchups = nextRound(matchups, winners);
    queue = [...matchups];
    winners = [];
  }

  const m = queue.shift();
  const rn = roundNames[matchups.length] || "";
  document.getElementById('roundLabel').textContent = rn;
  const inRound = matchups.length - queue.length;
  document.getElementById('progressText').textContent =
    `${m.region} · Matchup ${inRound} of ${matchups.length} · ${done} / ${totalMatchups} total`;
  document.getElementById('progressFill').style.width = (done/totalMatchups*100)+'%';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="vs-tag">${m.region} — who advances?</div>
    <div class="matchup">
      <div class="team teamA">
        <div class="seed">No. ${m.a.s} Seed</div>
        <div class="name">${m.a.n}</div>
        ${m.a.ig ? `<a class="ig" href="https://www.instagram.com/${m.a.ig}/" target="_blank" rel="noopener">@${m.a.ig}</a>` : ``}
        <div class="arrow">&#8592; swipe left</div>
      </div>
      <div class="divider"><span>VS</span></div>
      <div class="team teamB">
        <div class="seed">No. ${m.b.s} Seed</div>
        <div class="name">${m.b.n}</div>
        ${m.b.ig ? `<a class="ig" href="https://www.instagram.com/${m.b.ig}/" target="_blank" rel="noopener">@${m.b.ig}</a>` : ``}
        <div class="arrow">swipe right &#8594;</div>
      </div>
    </div>
    <div class="swipe-help"><span>&#8592; ${m.a.n}</span><span>${m.b.n} &#8594;</span></div>
    <div class="stamp left">Voted!</div>
    <div class="stamp right">Voted!</div>
  `;
  document.getElementById('stage').appendChild(card);
  attachSwipe(card, m);
}

function attachSwipe(card, matchup){
  let startX = 0, dx = 0, dragging = false;
  const teamA = card.querySelector('.teamA');
  const teamB = card.querySelector('.teamB');
  const stampL = card.querySelector('.stamp.left');
  const stampR = card.querySelector('.stamp.right');

  const onDown = e => {
    if(e.target.closest('a')) return; // IG handle tap opens link, no swipe
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    card.style.transition = 'none';
  };
  const onMove = e => {
    if(!dragging) return;
    dx = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    const tt = Math.min(Math.abs(dx)/110, 1);
    if(dx < -12){
      teamA.classList.add('hot'); teamB.classList.add('cold');
      teamB.classList.remove('hot'); teamA.classList.remove('cold');
      stampL.style.opacity = tt; stampR.style.opacity = 0;
    } else if(dx > 12){
      teamB.classList.add('hot'); teamA.classList.add('cold');
      teamA.classList.remove('hot'); teamB.classList.remove('cold');
      stampR.style.opacity = tt; stampL.style.opacity = 0;
    } else {
      teamA.classList.remove('hot','cold'); teamB.classList.remove('hot','cold');
      stampL.style.opacity = 0; stampR.style.opacity = 0;
    }
  };
  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    if(dx < -110){ fling(card, -1, matchup.a); }
    else if(dx > 110){ fling(card, 1, matchup.b); }
    else {
      card.style.transition = 'transform .25s';
      card.style.transform = '';
      teamA.classList.remove('hot','cold'); teamB.classList.remove('hot','cold');
      stampL.style.opacity = 0; stampR.style.opacity = 0;
    }
    dx = 0;
  };

  card.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  card.addEventListener('touchstart', onDown, {passive:true});
  card.addEventListener('touchmove', onMove, {passive:true});
  card.addEventListener('touchend', onUp);
}

function fling(card, dir, winner){
  card.style.transition = 'transform .35s ease-in, opacity .35s';
  card.style.transform = `translateX(${dir*600}px) rotate(${dir*30}deg)`;
  card.style.opacity = '0';
  winners.push(winner);
  done++;
  setTimeout(()=>{ card.remove(); showNext(); }, 330);
}

function showChampion(champ){
  done = totalMatchups;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = 'Tournament complete';
  document.getElementById('roundLabel').textContent = 'Champion';
  document.getElementById('champName').textContent = champ.n;
  const rc = regionChamps.map((c,i)=>`${regions[i].name}: <b style="color:#fff">${c.n}</b>`).join('<br>');
  document.getElementById('champRecap').innerHTML =
    rc + `<br><br>Finalists: <b style="color:#fff">${finalists.map(f=>f.n).join(' vs ')}</b>` +
    `<br><br>In the live version, everyone's swipes count together<br>and Charlotte decides who cuts down the nets.`;
  document.getElementById('champ').style.display = 'flex';
}

function restart(){
  document.querySelectorAll('.card').forEach(c=>c.remove());
  start();
}

start();
</script>
</body>
</html>
